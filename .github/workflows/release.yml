name: Release

# Maintains the release-please release PR. Merging that PR is the approval to
# release: it tags vX.Y.Z and creates the GitHub Release. This workflow then
# runs the full CI suite on that exact commit, builds the image for
# linux/amd64 and linux/arm64 on native runners, pushes each by digest only,
# runs the first-start test against those digests on their own architecture,
# and only then creates the multi-architecture tags in the public `shinan`
# project on cr.guneet.dev (architecture §11.4, D-054).
#
# Publishing an image deploys nothing: shinan.guneet.dev runs only the digests
# pinned in infra/musashi, and every deployment needs the owner's approval.
#
# Registry credentials: repository secrets REGISTRY_USERNAME and
# REGISTRY_PASSWORD, a Dockyard key with pull and push on the `shinan`
# project only. The project is public, so pulling needs no key; pushing does.
# There is no manual trigger; recover a failed publication with "Re-run failed
# jobs" on the release run.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: shinan-release
  cancel-in-progress: false

env:
  IMAGE: cr.guneet.dev/shinan/shinan

jobs:
  release-please:
    if: github.repository == 'guneet-xyz/shinan'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Pull requests created with GITHUB_TOKEN do not trigger workflows, so
      # run CI on the release PR's branch explicitly.
      - name: Run CI on the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          branch=$(node -e 'const prs = JSON.parse(process.env.RELEASE_PRS); if (prs.length !== 1 || !prs[0].headBranchName) throw new Error("Expected one release PR"); console.log(prs[0].headBranchName)')
          gh workflow run ci.yml --ref "$branch"

  # Checks the tag is the reported commit on main and works out the image
  # tags. `latest` and the vX.Y alias move only for the newest release.
  prepare:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
      tags: ${{ steps.resolve.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a stable vX.Y.Z release tag, got '$RELEASE_TAG'"
            exit 1
          fi
          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          version=${RELEASE_TAG#v}
          tagged_sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          if [ "$tagged_sha" != "$RELEASE_SHA" ]; then
            echo "::error::$RELEASE_TAG points at $tagged_sha, but release-please reported $RELEASE_SHA"
            exit 1
          fi
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          if [ "$(jq -r .version package.json)" != "$version" ]; then
            echo "::error::package.json version does not match $RELEASE_TAG"
            exit 1
          fi
          tags="v$version"
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          if [ "$latest" = "$RELEASE_TAG" ]; then
            tags="$tags v$major.$minor latest"
          else
            echo "::warning::$RELEASE_TAG is not the latest release ($latest); not moving latest or v$major.$minor"
          fi
          {
            echo "sha=$RELEASE_SHA"
            echo "version=$version"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

  # Full CI on the exact release commit, including the image's first-start
  # test. Nothing is published unless it passes.
  checks:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  build:
    name: Build (${{ matrix.platform }})
    needs: [prepare, checks]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-24.04
          - platform: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: cr.guneet.dev
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      # Pushed by digest only: no tag exists until the first-start test
      # passes. BuildKit attaches build provenance (SLSA, mode=max) and an
      # SBOM to the pushed image.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/${{ matrix.platform }}
          labels: |
            org.opencontainers.image.title=Shinan
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=v${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.platform }}
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Unexpected digest '$DIGEST'"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/$PLATFORM"
          echo "linux/$PLATFORM: \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7

  # The pushed digest, on its own architecture, through the reference
  # Compose file's whole first start.
  first-start:
    name: First start (${{ matrix.platform }})
    needs: [prepare, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-24.04
          - platform: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: cr.guneet.dev
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Pull the exact digest
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          ref="$IMAGE@$(cat "$RUNNER_TEMP/digests/$PLATFORM")"
          docker pull "$ref"
          echo "SHINAN_IMAGE=$ref" >> "$GITHUB_ENV"
      - run: node deploy/test/first-start.mjs

  publish:
    needs: [prepare, first-start]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: cr.guneet.dev
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Create the multi-architecture index and tags
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          for tag in $TAGS; do args+=(--tag "$IMAGE:$tag"); done
          docker buildx imagetools create "${args[@]}" \
            "$IMAGE@$(cat "$RUNNER_TEMP/digests/amd64")" \
            "$IMAGE@$(cat "$RUNNER_TEMP/digests/arm64")"
          docker buildx imagetools inspect "$IMAGE:v$VERSION" --raw > "$RUNNER_TEMP/index.json"
          jq --exit-status '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' "$RUNNER_TEMP/index.json"
          digest=$(docker buildx imagetools inspect "$IMAGE:v$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          {
            echo "### $IMAGE"
            echo "Index digest (pin this in infra/musashi): \`$digest\`"
            echo
            for tag in $TAGS; do echo "- \`$IMAGE:$tag\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
