# Reference Compose file for running Shinan yourself (architecture §12).
# The operator guide (docs/operator-guide.md) explains every setting, the
# first start, upgrades and the risks. In short, next to this file:
#
#   .env        settings that are not secret (copy .env.example)
#   secrets/    one file per secret, the directory readable only by you
#
#   docker compose up -d
#   docker compose logs web     the one-time setup link, on first start
#
# Services: PostgreSQL, `migrate` (prepares the database, then exits), `web`
# (pages and API), `worker` (background jobs and email) and `git` (the
# catalog's Git repositories, reachable only by the other roles). Put an
# HTTPS reverse proxy in front of `web`; Shinan never serves plain HTTP to
# the internet. This file starts no proxy.
name: shinan

x-shinan: &shinan
  image: ${SHINAN_IMAGE:?Set SHINAN_IMAGE in .env to a Shinan image, pinned by digest}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

networks:
  # PostgreSQL and every Shinan role. No internet access.
  backend:
    internal: true
  # Outgoing internet access for `web` (GitHub sign-in) and `worker` (SES).
  egress: {}
  # The Git container and the roles that call it. No internet access, and
  # the Git container is on no other network.
  git:
    internal: true

services:
  postgres:
    image: postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    restart: unless-stopped
    environment:
      POSTGRES_USER: shinan
      POSTGRES_DB: shinan
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, shinan, -d, shinan]
      interval: 5s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    # The entrypoint prepares the data directory as root, then runs as
    # `postgres`.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    shm_size: 128m
    logging: *logging
    networks:
      - backend

  # Runs on every `up`: applies new migrations, then exits. `web` and `worker`
  # start only after it succeeds.
  migrate:
    <<: *shinan
    command: migrate
    restart: "no"
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      # On the upgrade to 0.4, moves the catalog into the workspaces'
      # repositories in the Git container before M2's tables are dropped.
      SHINAN_GIT_URL: http://git:3000
      SHINAN_GIT_SERVICE_TOKEN_FILE: /run/secrets/git_service_token
    secrets:
      - database_url
      - git_service_token
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      git:
        condition: service_healthy
    mem_limit: 256m
    networks:
      - backend
      - git

  web:
    <<: *shinan
    command: web
    environment:
      SHINAN_URL: ${SHINAN_URL:?Set SHINAN_URL in .env to the installation's https address}
      SHINAN_OPERATORS: ${SHINAN_OPERATORS:?Set SHINAN_OPERATORS in .env to the operators' email addresses}
      SHINAN_TRUSTED_PROXIES: ${SHINAN_TRUSTED_PROXIES:-}
      DATABASE_URL_FILE: /run/secrets/database_url
      SHINAN_SESSION_SECRET_FILE: /run/secrets/session_secret
      # The Git container: the catalog's reads (a page's History and View
      # source) and agents' fetches and pushes (`/git/`), forwarded to it.
      SHINAN_GIT_URL: http://git:3000
      SHINAN_GIT_SERVICE_TOKEN_FILE: /run/secrets/git_service_token
    secrets:
      - database_url
      - session_secret
      - git_service_token
    # For a reverse proxy on this machine. The internal listener for health
    # checks (port 3001) stays inside the container.
    ports:
      - 127.0.0.1:${SHINAN_PORT:-3000}:3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    # M2's 1,536 MiB, kept until the Git-based catalog's push checks are
    # measured (Git-based catalog plan, GC-11; operator guide).
    mem_limit: ${SHINAN_WEB_MEMORY:-1536m}
    stop_grace_period: 30s
    networks:
      - backend
      - egress
      - git

  worker:
    <<: *shinan
    command: worker
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      EMAIL_TRANSPORT: ses
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM in .env to the address Shinan sends from}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Shinan}
      SES_REGION: ${SES_REGION:?Set SES_REGION in .env, such as us-east-1}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
      SES_ACCESS_KEY_ID_FILE: /run/secrets/ses_access_key_id
      SES_SECRET_ACCESS_KEY_FILE: /run/secrets/ses_secret_access_key
      # Makes each new workspace's repository in the Git container.
      SHINAN_GIT_URL: http://git:3000
      SHINAN_GIT_SERVICE_TOKEN_FILE: /run/secrets/git_service_token
    secrets:
      - database_url
      - ses_access_key_id
      - ses_secret_access_key
      - git_service_token
    # The worker has no listener to check.
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 384m
    stop_grace_period: 30s
    networks:
      - backend
      - egress
      - git

  # The catalog's Git repositories (architecture §3.2, D-065): one bare
  # repository per workspace on the `catalog` volume, served to the other
  # roles over the internal `git` network only, to requests carrying the
  # service token. It holds that token and nothing else: no database
  # address, no other secret, no internet access, no published port. Its
  # health check is the image's own (its internal listener, inside the
  # container).
  git:
    <<: *shinan
    command: git
    environment:
      SHINAN_CATALOG_DIR: /var/lib/shinan/catalog
      SHINAN_GIT_SERVICE_TOKEN_FILE: /run/secrets/git_service_token
    secrets:
      - git_service_token
    volumes:
      - catalog:/var/lib/shinan/catalog
    mem_limit: ${SHINAN_GIT_MEMORY:-1024m}
    stop_grace_period: 30s
    networks:
      - git

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  session_secret:
    file: ./secrets/session_secret
  ses_access_key_id:
    file: ./secrets/ses_access_key_id
  ses_secret_access_key:
    file: ./secrets/ses_secret_access_key
  git_service_token:
    file: ./secrets/git_service_token

volumes:
  postgres:
  # The catalog's repositories and the Git container's journal.
  catalog:
